name: Deploy frontend

# Simple single-server deployment: SSH into the VM, pull the published GHCR
# image for the given commit SHA, and restart the frontend container via
# docker compose. Replaces the previous EKS/multi-region workflow, which
# required a self-hosted runner inside a private VPC — not needed for this
# lighter-weight target. See infrastructure/production/ for the compose file.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Git SHA (without sha- prefix) to deploy
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: frontend-prod
      cancel-in-progress: false
    steps:
      - name: Validate image tag
        run: |
          test "${#IMAGE_TAG}" -eq 40
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/creator-link-store-infrastructure/production
            export FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/creator-link-store-frontend:sha-${{ inputs.image_tag }}"
            docker compose pull creator-store-web
            docker compose up -d creator-store-web
